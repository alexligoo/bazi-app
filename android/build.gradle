allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    if (project.name != 'app') {
        project.afterEvaluate {
            if (project.hasProperty('android')) {
                if (project.android.namespace == null) {
                    def manifest = file("${project.projectDir}/src/main/AndroidManifest.xml")
                    if (manifest.exists()) {
                        def content = manifest.text
                        def matcher = content =~ /package\s*=\s*"([^"]+)"/
                        if (matcher.find()) {
                            project.android.namespace = matcher.group(1)
                        }
                    }
                }
                project.android.compileSdkVersion 35
                // Force Java 17 for all plugins
                project.android.compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
        }
    }
}
subprojects {
    project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            jvmTarget = "17"
        }
    }
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
